# Template repository CI. Add "template-ci" (both matrix jobs) as required status checks in protect-main.
name: template-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: template-ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "copier==9.19.1"
      - name: Acceptance tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          # One annotation per failing test (annotations are readable without opening the log).
          python - <<'PY'
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n={70}\n", text)
          for block in blocks:
              if re.match(r"(FAIL|ERROR): ", block):
                  body = block.strip()[-3000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print("::error::" + body)
          PY

  pr-meta:
    # Branch name and pull request title rules for this repository, using the generated validator.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "copier==9.19.1"
      - name: Render validator and check branch and title
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config --global user.name "template-ci"
          git config --global user.email "template-ci@users.noreply.github.com"
          copier copy --defaults --quiet --vcs-ref HEAD --data-file tests/fixtures/ai-biz-example-assisted.yml . "$RUNNER_TEMP/ai-biz-example-assisted"
          python "$RUNNER_TEMP/ai-biz-example-assisted/scripts/check_governance.py" --meta-only --branch "$HEAD_REF" --pr-title "$PR_TITLE"
